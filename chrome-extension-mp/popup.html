<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Zono MP Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 360px; background: #001538; color: #f8fafc; padding: 16px; font-size: 13px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; padding-bottom: 12px; margin-bottom: 14px; }
    .title { font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 8px; color: #38bdf8; }
    .badge { background: #064e3b; color: #34d399; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 999px; display: flex; align-items: center; gap: 5px; border: 1px solid #059669; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; }
    .section-title { font-size: 11px; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin: 14px 0 8px 0; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
    .field { margin-bottom: 10px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    label { display: block; font-size: 10px; font-weight: 600; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.4px; }
    input, select { width: 100%; background: #0f172a; border: 1px solid #334155; color: white; padding: 7px 10px; border-radius: 8px; font-size: 12px; outline: none; }
    input:focus, select:focus { border-color: #0069ff; }
    .helper-text { font-size: 10px; color: #64748b; margin-top: 3px; }
    .days-grid { display: flex; gap: 4px; margin-top: 4px; }
    .day-btn { flex: 1; text-align: center; padding: 5px 0; background: #0f172a; border: 1px solid #334155; color: #94a3b8; border-radius: 6px; font-size: 10px; font-weight: 700; cursor: pointer; user-select: none; }
    .day-btn.active { background: #0069ff; border-color: #38bdf8; color: white; }
    .btn-save { width: 100%; background: #0069ff; color: white; border: none; padding: 9px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    .btn-save:hover { background: #0052cc; }
    .btn-test { width: 100%; background: transparent; color: #94a3b8; border: 1px solid #334155; padding: 7px; border-radius: 8px; font-weight: 600; font-size: 11px; cursor: pointer; margin-top: 6px; }
    .btn-test:hover { background: #0f172a; color: white; }
    .history { margin-top: 14px; border-top: 1px solid #1e293b; padding-top: 10px; }
    .history-title { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; }
    .history-list { max-height: 100px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
    .history-item { background: #0f172a; padding: 6px 10px; border-radius: 6px; font-size: 11px; border-left: 3px solid #10b981; }
    .history-amount { font-weight: 700; color: #34d399; }
    .history-time { font-size: 9px; color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>⚡</span> Zono MP Monitor
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <span id="popupClock" style="font-size: 10px; font-weight: 700; color: #cbd5e1; background: #0f172a; border: 1px solid #334155; padding: 2px 6px; border-radius: 6px;" title="Hora detectada por la extensión (Argentina)">🕒 --:--:--</span>
      <div class="badge" id="connBadge">
        <span class="dot" id="connDot"></span> <span id="connText">ONLINE</span>
      </div>
    </div>
  </div>

  <div class="field">
    <label>Cuenta Mercado Pago activa</label>
    <select id="accountName">
      <option value="pagoszono.26">pagoszono.26 (Empresa)</option>
      <option value="diegozono.mp">diegozono.mp (Personal / Reserva)</option>
    </select>
  </div>

  <div class="section-title">🕒 Horarios de Oficina y Refresco</div>

  <div class="field-row">
    <div>
      <label>Desde (Inicio)</label>
      <input type="time" id="workStart" value="06:00" />
    </div>
    <div>
      <label>Hasta (Fin)</label>
      <input type="time" id="workEnd" value="21:00" />
    </div>
  </div>

  <div class="field">
    <label>Días Laborales</label>
    <div class="days-grid">
      <div class="day-btn active" data-day="1">L</div>
      <div class="day-btn active" data-day="2">M</div>
      <div class="day-btn active" data-day="3">M</div>
      <div class="day-btn active" data-day="4">J</div>
      <div class="day-btn active" data-day="5">V</div>
      <div class="day-btn active" data-day="6">S</div>
      <div class="day-btn" data-day="0">D</div>
    </div>
    <div class="helper-text">Azul = día activo con monitoreo intensivo</div>
  </div>

  <div class="field-row">
    <div>
      <label>Refresco Oficina</label>
      <select id="workInterval">
        <option value="15">Cada 15 seg</option>
        <option value="20">Cada 20 seg</option>
        <option value="30">Cada 30 seg</option>
        <option value="45">Cada 45 seg</option>
        <option value="60" selected>Cada 1 min</option>
      </select>
    </div>
    <div>
      <label>Fuera de Horario</label>
      <select id="offInterval">
        <option value="120">Cada 2 min</option>
        <option value="300">Cada 5 min</option>
        <option value="600" selected>Cada 10 min</option>
        <option value="900">Cada 15 min</option>
        <option value="1800">Cada 30 min</option>
      </select>
    </div>
  </div>

  <div class="section-title">🔗 Conexión con Zono ERP</div>

  <div class="field">
    <label>Webhook URL</label>
    <input type="text" id="webhookUrl" value="https://zono-erp.pages.dev/api/mp-webhook" />
  </div>

  <div class="field">
    <label>Clave Secreta</label>
    <input type="password" id="secretToken" value="mpchecker_secret_key_123" />
  </div>

  <button class="btn-save" id="btnSave">Guardar configuración</button>
  <button class="btn-test" id="btnTest">Enviar prueba ($100 a Zono)</button>

  <div class="history">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div class="history-title">Últimos Pagos Detectados</div>
      <button id="btnClearHistory" style="background: none; border: none; color: #64748b; font-size: 10px; cursor: pointer; text-decoration: underline;">Limpiar</button>
    </div>
    <div class="history-list" id="historyList">
      <div style="color: #64748b; font-size: 11px; text-align: center; padding: 6px;">Aún no se detectaron cobros</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
