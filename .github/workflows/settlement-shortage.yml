name: Settlement shortage protection
on:
  pull_request:
    paths:
      - 'src/components/logistics/SettlementShortageNotice.tsx'
      - 'src/app/admin/rendiciones/**'
      - 'src/app/api/admin/rendiciones/**'
      - 'database/*settlement_shortage*'
      - 'tests/settlement-shortage-guard.test.cjs'
      - '.github/workflows/settlement-shortage.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --prefix .codex-tmp/supplier-account-check --no-save --package-lock=false @electric-sql/pglite@0.5.10
      - run: node --test tests/settlement-shortage-guard.test.cjs tests/logistics-settlement-accounting.test.cjs tests/settlement-orders.test.cjs
